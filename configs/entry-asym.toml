# Entry side (Iran), direct mode, asymmetric transport: it sends to the exit over `ws` and
# receives the return traffic over `tcp` — two paired connections joined into one tunnel.
# Useful where upload and download are filtered differently. Encryption and mux ride the
# combined stream as usual. Both servers need Kariz 2.10 or newer. Pair: exit-asym.toml.
role = "entry"
mode = "direct"
profile = "balanced"

[tunnel]
transport = "ws"                    # send direction (entry → exit)
recv_transport = "tcp"             # receive direction (exit → entry); dials the exit's port + 1
remote = "EXIT_SERVER_IP:3080"
token = "CHANGE-ME-run-kariz-token"

# Shared by whichever direction is a WebSocket (here the send link).
[tunnel.ws]
path = "/stream"

[[forward]]
listen = "0.0.0.0:443"
target = "127.0.0.1:443"

[log]
level = "info"
