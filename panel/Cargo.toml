[package]
name = "kariz-panel"
version = "2.10.0"
edition = "2021"
rust-version = "1.80"
description = "The Kariz web panel: sign-in, servers, tunnels, live monitoring."
publish = false
license-file = "../LICENSE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kariz-panel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "http1", "tokio", "service"] }
# kcp and quic: the agents' link falls back to them where TCP is stalled (quic is always sealed).
# rawlink/helpers/l3: so the embedded agent accepts the raw-packet, helper and l3 transports.
kariz = { path = "..", default-features = false, features = ["kcp", "quic", "rawlink", "helpers", "l3"] }
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rust-embed = "8"
# Bundled SQLite: the binary stays static, like the core.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
# Downloading a release (a blocking client, run off the async threads), and its archive.
# socks-proxy: the Telegram bot can go through a SOCKS5 proxy where Telegram is blocked.
ureq = { version = "2", default-features = false, features = ["tls", "socks-proxy"] }
flate2 = "1"
tar = "0.4"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
