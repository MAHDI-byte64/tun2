name: Release

# Pushing a tag like v0.2.0 builds static Linux binaries for x86_64, aarch64 and armv7
# and publishes a GitHub release with the notes of that version from CHANGELOG.md.
# One archive per architecture, named kariz-<tag>-<arch>-linux.tar.gz, each with its
# SHA-256 (scripts/kariz.sh downloads them by those names).
#
# The binaries move between jobs as release assets (uploaded with `gh release`), not as
# Actions artifacts: release-asset storage is separate from the Actions artifact-storage
# quota, so a full artifact quota no longer blocks a release. A `prepare` job creates the
# release (as a draft) first so the matrix uploads have somewhere to go, and the `publish`
# job downloads the archives back, signs them, attaches the signatures, sets the notes and
# publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Make sure a release exists for the tag before the matrix uploads to it. If one was made
  # from the web UI already (which is what created the tag), this is a no-op.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Ensure a draft release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Kariz $GITHUB_REF_NAME" \
              --notes "Build in progress…"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            cross: true
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The panel's web app is built first; the binary embeds panel/web/dist.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: panel/web
      - if: ${{ !matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p kariz -p kariz-panel
        env:
          # Keep the x86_64 release compatible with any 64-bit Intel/AMD CPU (no AVX2/BMI/FMA
          # on unguarded paths), so it runs on older servers such as Ivy Bridge Xeons (E5 v2).
          # Crypto still uses AES-NI/AVX2 at run time via its own detection, so throughput on
          # modern servers is unchanged. Set here (not just in .cargo/config.toml) so it wins
          # over any RUSTFLAGS the runner environment might carry.
          RUSTFLAGS: "-C target-cpu=x86-64"
      - if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: ${{ matrix.cross }}
        run: cross build --release --locked --target ${{ matrix.target }} -p kariz -p kariz-panel
      - name: Package
        run: |
          name="kariz-$GITHUB_REF_NAME-${{ matrix.arch }}-linux"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/kariz" "target/${{ matrix.target }}/release/kariz-panel" README.md README_FA.md CHANGELOG.md "$name/"
          cp -r configs systemd scripts assets "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      # Upload the archive and its checksum to the release (a release asset, so the Actions
      # artifact-storage quota does not apply). The publish job signs them afterwards.
      - name: Upload the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="kariz-$GITHUB_REF_NAME-${{ matrix.arch }}-linux"
          gh release upload "$GITHUB_REF_NAME" --clobber "$name.tar.gz" "$name.tar.gz.sha256"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the archives from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'kariz-*.tar.gz' --pattern 'kariz-*.tar.gz.sha256'
      - name: Three archives, each with its checksum
        run: |
          ls -l kariz-*
          test "$(ls kariz-*.tar.gz | wc -l)" = 3
          for f in kariz-*.tar.gz; do sha256sum -c "$f.sha256"; done
      # Releases are signed: the private key is the repository secret
      # KARIZ_SIGNING_KEY, and every signature is checked with the public key built into
      # the program before anything is published, so a wrong secret stops the release.
      - name: Sign the checksums
        env:
          KARIZ_SIGNING_KEY: ${{ secrets.KARIZ_SIGNING_KEY }}
        run: |
          if [ -z "$KARIZ_SIGNING_KEY" ]; then
            echo "::error::the repository secret KARIZ_SIGNING_KEY is not set: releases must be signed"
            exit 1
          fi
          tar -xzf kariz-*-x86_64-linux.tar.gz --wildcards '*/kariz-panel' --strip-components=1
          for f in kariz-*.tar.gz.sha256; do ./kariz-panel release-sign "$f"; done
          for f in kariz-*.tar.gz; do ./kariz-panel release-verify "$f"; done
          ls -l kariz-*.sig
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a dash (v0.8.0-beta) is a prerelease: GitHub's "latest release",
          # which `kariz-manager install` and `update` use, stays on the last stable one.
          flags=(--draft=false)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release upload "$GITHUB_REF_NAME" --clobber kariz-*.tar.gz.sig
          gh release edit "$GITHUB_REF_NAME" --title "Kariz $GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
