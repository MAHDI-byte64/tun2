name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lints, which fail in seconds: kept apart from the tests, so a mistake
  # shows before the tests have even built.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Builds without the optional transports (cargo features quic and kcp).
      - run: cargo clippy --lib --bins --no-default-features -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features quic -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features kcp -- -D warnings
      # The raw-packet, helper and l3 features, on their own (they build everywhere; the
      # root-only parts need a privileged runner, see the `rawlink` job below).
      - run: cargo clippy --lib --bins --no-default-features --features rawlink -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features helpers -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features l3 -- -D warnings
      # The web panel (panel/); without its web app built, the binary embeds a placeholder
      # page, which is all a lint needs.
      - run: cargo clippy -p kariz-panel --all-targets -- -D warnings

  # The core's tests and the panel's run side by side: each takes a few minutes.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  test-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The web app is built first and embedded in the binary.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: panel/web
      - run: cargo test -p kariz-panel

  # The release targets, built the way the release builds them (`cross` for the ARM ones:
  # Docker images with the C cross-compilers that ring and mimalloc need). The ARM
  # library tests run under QEMU, so a target-specific break (32-bit atomics, alignment)
  # shows before a release.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # cross builds in a container with this target/ and the registry mounted, so the
      # cache works as for a native build; one per target.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: panel/web
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release --locked --target ${{ matrix.target }} -p kariz -p kariz-panel
      - run: ls -l target/${{ matrix.target }}/release/kariz target/${{ matrix.target }}/release/kariz-panel
      - name: Library tests under QEMU
        run: cross test --locked --target ${{ matrix.target }} --lib

  # scripts/kariz.sh on a real systemd host: install from a local build, the menu through a
  # terminal, the panel and an agent, signed releases, updating the panel from the panel. The
  # tunnels the agent would make are written by hand here (same files, same units).
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: shellcheck scripts/*.sh
      - name: The panel follows a new IP address of its server
        run: shellcheck -x tests/heal.sh && bash tests/heal.sh
      - run: cargo build --release --locked -p kariz -p kariz-panel
      - name: Install with the manager
        run: |
          sudo scripts/kariz.sh install --binary target/release/kariz --panel-binary target/release/kariz-panel
          kariz-manager help >/dev/null
      - name: Two tunnels by hand, as the agent would write them
        run: |
          python3 -m http.server 18081 --bind 127.0.0.1 >/dev/null 2>&1 &
          tok=$(/usr/local/bin/kariz token)
          sudo tee /etc/kariz/plain.toml >/dev/null <<EOF
          role = "entry"
          mode = "reverse"
          [tunnel]
          transport = "tcpmux"
          listen = "127.0.0.1:3080"
          token = "$tok"
          [[forward]]
          listen = "127.0.0.1:18080"
          target = "127.0.0.1:18081"
          EOF
          sudo tee /etc/kariz/plain-exit.toml >/dev/null <<EOF
          role = "exit"
          mode = "reverse"
          [tunnel]
          transport = "tcpmux"
          remote = "127.0.0.1:3080"
          token = "$tok"
          EOF
          sudo sh -c 'chmod 600 /etc/kariz/*.toml'
          sudo systemctl enable --now kariz@plain kariz@plain-exit
          sleep 3
          curl -sf --max-time 5 http://127.0.0.1:18080/ >/dev/null
      - name: The menu through a real terminal, installed and piped in
        run: |
          sudo python3 tests/manager_tty.py kariz-manager
          sudo python3 tests/manager_tty.py bash -c 'cat scripts/kariz.sh | bash'
      - name: Update restarts running tunnels
        run: |
          out=$(sudo kariz-manager update --binary target/release/kariz)
          echo "$out"
          echo "$out" | grep -q "2 running tunnel(s) restarted"
          sleep 3
          curl -sf --max-time 5 http://127.0.0.1:18080/ >/dev/null
      # The web panel and an agent, through the manager: install, sign in with the link it
      # prints, make a join code, connect this same machine as an agent, and see it online
      # with the health `/proc` gives and the tunnels made above.
      - name: The web panel and an agent through the manager
        run: |
          # Let's Encrypt cannot be reached from here: a certificate made for the test.
          sudo mkdir -p /etc/kariz-ci
          sudo openssl req -x509 -newkey rsa:2048 -nodes -keyout /etc/kariz-ci/key.pem -out /etc/kariz-ci/cert.pem \
            -days 2 -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 2>/dev/null
          sudo kariz-manager panel install --port 28443 --host 127.0.0.1 \
            --cert-file /etc/kariz-ci/cert.pem --key-file /etc/kariz-ci/key.pem | tee panel.txt
          grep -q "certificate" panel.txt
          link=$(grep -o 'https://[^ ]*#t=[0-9a-f]*' panel.txt)
          base=${link%%#*}
          token=${link##*#t=}
          curl -skf "$base" | grep -q Kariz
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:28443/nothing)" = 404
          curl -sk -c jar -H 'Content-Type: application/json' -d "{\"token\":\"$token\"}" "${base}api/link" | tee signin.json
          csrf=$(sed -n 's/.*"csrf":"\([0-9a-f]*\)".*/\1/p' signin.json)
          test -n "$csrf"
          code=$(curl -sk -b jar -H "X-Kariz-CSRF: $csrf" -H 'Content-Type: application/json' \
            -d '{"name":"ci-agent","host":"127.0.0.1"}' "${base}api/servers/join-code" |
            sed -n 's/.*"code":"\([^"]*\)".*/\1/p')
          test -n "$code"
          sudo KARIZ_NO_UPDATE_CHECK=1 kariz-manager --agent "$code"
          for _ in $(seq 1 30); do
            curl -sk -b jar "${base}api/servers" > servers.json
            jq -e '.servers[] | select(.name == "ci-agent" and .online)' servers.json >/dev/null && break
            sleep 1
          done
          cat servers.json
          jq -e '.servers[] | select(.name == "ci-agent" and .online)' servers.json >/dev/null
          grep -q '"name":"plain"' servers.json
          grep -Eq '"mem_total":[0-9]+' servers.json
          # a login link works once
          curl -sk -H 'Content-Type: application/json' -d "{\"token\":\"$token\"}" "${base}api/link" | grep -q wrong
          # the update restarts the panel and the agent
          out=$(sudo kariz-manager update --binary target/release/kariz --panel-binary target/release/kariz-panel)
          echo "$out" | grep -q "Restarted kariz-panel"
          echo "$out" | grep -q "Restarted kariz-agent"
      # The manager checks release signatures with openssl and the key in the script; here a
      # key made for the test is pinned, since only the release workflow has the real one.
      - name: Release signatures
        run: |
          kp=target/release/kariz-panel
          d=$(mktemp -d)
          n=kariz-v0.11.0-x86_64-linux
          out=$($kp release-key --out "$d/key")
          pem=$(printf '%s\n' "$out" | sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p')
          hexkey=$(printf '%s\n' "$out" | sed -n 's/^public key (hex): //p')
          echo "an archive" > "$d/$n.tar.gz"
          (cd "$d" && sha256sum "$n.tar.gz" > "$n.tar.gz.sha256")
          KARIZ_SIGNING_KEY=$(cat "$d/key") $kp release-sign "$d/$n.tar.gz.sha256"
          $kp release-verify --key "$hexkey" "$d/$n.tar.gz"
          check() { KARIZ_RELEASE_KEY_PEM="$pem" bash -c 'source scripts/kariz.sh; verify_signature "$@"' _ "$@"; }
          check "$d" "$n" v0.11.0
          # the release's own key (built in) does not accept a signature made with another
          if bash -c 'source scripts/kariz.sh; verify_signature "$@"' _ "$d" "$n" v0.11.0; then exit 1; fi
          # a checksum file that was changed after signing
          cp -r "$d" "$d-t"
          echo x >> "$d-t/$n.tar.gz.sha256"
          if check "$d-t" "$n" v0.11.0; then echo "a changed checksum file passed" >&2; exit 1; fi
          # a signed archive put under another name (another CPU's)
          m=kariz-v0.11.0-aarch64-linux
          mkdir "$d-n"
          for e in tar.gz tar.gz.sha256 tar.gz.sig; do cp "$d/$n.$e" "$d-n/$m.$e"; done
          if check "$d-n" "$m" v0.11.0; then echo "a swapped archive passed" >&2; exit 1; fi
          # no signature: fine for a release before 0.11 (with a warning), refused from 0.11
          rm "$d/$n.tar.gz.sig"
          check "$d" "$n" v0.10.0
          if check "$d" "$n" v0.11.0; then echo "an unsigned 0.11 passed" >&2; exit 1; fi
      # Offline install: the same archive layout a release ships, signed with the test key,
      # installed through the manager's offline path (no network) into a temp prefix, and
      # found by its auto-discovery.
      - name: Offline install from a local archive
        run: |
          repo=$PWD
          kp=target/release/kariz-panel
          d=$(mktemp -d)
          out=$($kp release-key --out "$d/key")
          pem=$(printf '%s\n' "$out" | sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p')
          off=$(mktemp -d); n=kariz-v99.0.0-x86_64-linux; mkdir -p "$off/$n"
          cp target/release/kariz target/release/kariz-panel "$off/$n/"
          (cd "$off" && tar czf "$n.tar.gz" "$n" && sha256sum "$n.tar.gz" > "$n.tar.gz.sha256")
          KARIZ_SIGNING_KEY=$(cat "$d/key") $kp release-sign "$off/$n.tar.gz.sha256"
          # Install from the archive by path, into a temporary prefix.
          dst=$(mktemp -d)
          KARIZ_RELEASE_KEY_PEM="$pem" bash -c "source '$repo/scripts/kariz.sh'; BIN='$dst/kariz'; PANEL_BIN='$dst/kariz-panel'; install_from_archive '$off/$n.tar.gz'"
          test -x "$dst/kariz" && test -x "$dst/kariz-panel"
          # Auto-discovery finds the archive copied next to the manager (its .sha256 is there).
          found=$(cd "$off" && bash -c "source '$repo/scripts/kariz.sh'; find_local_archive")
          test "$found" = "$off/$n.tar.gz"
          # A tampered archive is refused and nothing is installed.
          printf x >> "$off/$n.tar.gz"; bad=$(mktemp -d)
          if KARIZ_RELEASE_KEY_PEM="$pem" bash -c "source '$repo/scripts/kariz.sh'; BIN='$bad/kariz'; PANEL_BIN='$bad/kariz-panel'; install_from_archive '$off/$n.tar.gz'"; then
            echo "a tampered archive installed" >&2; exit 1
          fi
          test ! -e "$bad/kariz"
      # Updating the panel from the panel, on this systemd host: a second panel is built that
      # calls itself 99.0.0, a local server plays the releases (signed with a key made for the
      # test), and the panel must roll back a release that does not come up and take a good one.
      - name: Update the panel from the panel
        run: |
          shellcheck tests/update_e2e.sh
          cp target/release/kariz-panel /tmp/kariz-panel-old
          KARIZ_BUILD_VERSION=99.0.0 cargo build --release --locked -p kariz-panel
          cp target/release/kariz-panel /tmp/kariz-panel-new
          sudo bash tests/update_e2e.sh /tmp/kariz-panel-new target/release/kariz
      - name: Banner in the journal, priority prefixes understood
        run: |
          sudo journalctl -u kariz@plain -o cat --no-pager | tee journal.txt | head -20
          grep -q "developed by ErfanXRay" journal.txt
          ! grep -q '^<[0-9]>' journal.txt
      - name: Remove and uninstall
        run: |
          sudo systemctl disable --now kariz@plain kariz@plain-exit
          sudo kariz-manager agent remove
          sudo kariz-manager panel uninstall --yes
          test ! -e /etc/kariz-panel/panel.toml
          test ! -e /usr/local/bin/kariz-panel
          sudo kariz-manager uninstall --yes
          test ! -e /usr/local/bin/kariz
      - if: failure()
        run: sudo journalctl -u 'kariz@*' -u kariz-panel -u kariz-agent --no-pager -n 200

  # Private networks (phase 13): two network namespaces play two servers, and the agent's
  # GRE code (`kariz-panel net`) links them: the private addresses answer, two links between
  # the same pair work at once, a filtered GRE path fails the test, `net down` removes it.
  gre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: shellcheck tests/gre_ns.sh
      - run: cargo build -p kariz -p kariz-panel
      - run: sudo bash tests/gre_ns.sh target/debug/kariz-panel target/debug/kariz

  # The raw-packet carriers (faketcp, icmp) and the l3 / GRE direct tunnel need root
  # (CAP_NET_RAW / CAP_NET_ADMIN), iptables and /dev/net/tun, so like the `gre` job they run
  # under sudo. The RAII-firewall unit tests and the e2e scaffolds in tunnel_rawlink / l3
  # (which the faketcp, icmp and l3 units fill in) force a failure rather than skip here.
  rawlink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo -E env "PATH=$PATH" KARIZ_REQUIRE_IPTABLES=1 KARIZ_REQUIRE_RAWLINK=1 cargo test --features rawlink --lib -- rawlink
      - run: sudo -E env "PATH=$PATH" KARIZ_REQUIRE_RAWLINK=1 cargo test --features rawlink --test tunnel_rawlink -- --nocapture
      - run: sudo -E env "PATH=$PATH" KARIZ_REQUIRE_L3=1 cargo test --features l3 --test l3 -- --nocapture

  # The panel the way a person uses it: Playwright drives a real browser against a real panel
  # and a real agent (tunnels run as child processes, so no systemd is needed here). It covers
  # signing in, adding a server, making, editing, stopping and deleting a tunnel with traffic
  # through it, a tunnel that cannot connect being undone, the look in both languages and
  # themes, and axe (WCAG 2.1 A and AA) on every page and dialog.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: panel/web
      - run: cargo build -p kariz -p kariz-panel
      - run: npx playwright install --with-deps chromium
        working-directory: panel/web
      - run: npx playwright test
        working-directory: panel/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: panel/web/e2e-results
          retention-days: 7

  # Known vulnerabilities in the dependencies (RustSec's advisory database). It runs on the
  # lock file, so it also catches an advisory published after the last change.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # nginx in front of the tunnel as a stand-in for a CDN: WebSocket proxying, TLS
  # termination and an idle timeout (tests/tunnel.rs, module `nginx`).
  cdn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nginx-light
      - run: cargo test --test tunnel nginx -- --nocapture
        env:
          KARIZ_REQUIRE_NGINX: "1"
          KARIZ_NGINX: /usr/sbin/nginx
