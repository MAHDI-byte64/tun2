[package]
name = "kariz"
version = "2.7.1"
edition = "2021"
rust-version = "1.80"
description = "High-performance, resource-efficient tunnel core for server-to-server links, built to resist DPI."
publish = false
license-file = "LICENSE"

# The web panel is a separate crate that uses this one as a library.
# A plain `cargo build` at the root still builds only `kariz`.
[workspace]
members = ["panel"]

# Password hashing is slow unoptimized; the panel tests hash a few passwords.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3

[lib]
path = "src/lib.rs"

[[bin]]
name = "kariz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
httparse = "1.10"
# transport = "faketcp" / "icmp": build and parse IP/TCP/ICMP (etherparse) and the raw
# sockets / getifaddrs (nix). Both pinned to an MSRV-1.80-safe line: etherparse 0.17 has
# no declared MSRV (the 1.83 bump is in 0.18); nix 0.29 declares rust-version 1.69.
etherparse = { version = "0.17", optional = true }
nix = { version = "0.29", default-features = false, features = ["net", "socket", "signal", "process", "ioctl"], optional = true }
kcp = { version = "0.6.0", optional = true }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
# Pinned exactly: src/allocator.rs names an option by its index in this version.
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
quinn-proto = { version = "0.11", default-features = false, optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"], optional = true }
reed-solomon-simd = { version = "3.0.1", optional = true }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Local time in log lines (the offset is read once, before any thread starts).
time = { version = "0.3", features = ["local-offset"] }
webpki-roots = "1"

[features]
default = ["quic", "kcp", "mimalloc", "rawlink", "helpers", "l3"]
# transport = "quic" (quinn).
quic = ["dep:quinn", "dep:quinn-proto", "dep:rcgen"]
# transport = "kcp", with FEC.
kcp = ["dep:kcp", "dep:reed-solomon-simd"]
# The raw-packet KCP carriers transport = "faketcp" / "icmp" (Linux, root), and their
# shared RAII iptables helper. Implies kcp (they are KCP carriers). etherparse builds and
# parses the IP/TCP/ICMP framing; nix opens the AF_PACKET socket and reads the interface
# addresses. The raw-socket code is gated on target_os = "linux" inside the feature.
rawlink = ["kcp", "dep:etherparse", "dep:nix"]
# The managed-helper transports transport = "naive" / "xhttp" / "reality". The acceptor
# runs the helper server (sing-box naive inbound / Xray) and forwards to a Kariz-owned
# loopback listener; the dialer runs the helper client's local SOCKS5 inbound that Kariz
# dials through. The supervisor uses nix for the process-group kill on teardown.
helpers = ["dep:nix", "tokio/process"]
# The [l3] / GRE direct-tunnel mode (Linux, root). Implies rawlink (MSS-clamp rules, and
# the faketcp/icmp carriers). The TUN/TAP device is created with nix's TUNSETIFF ioctl
# (nix is already a dep; the `ioctl` feature is enabled for it) and configured with the
# `ip` iproute2 command — no netlink crate is added, so MSRV 1.80 is unaffected.
l3 = ["rawlink"]
# mimalloc as the global allocator of the kariz binary (musl's own is slow).
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dev-dependencies]
rcgen = "0.14"
# The l3 end-to-end tests put each tunnel endpoint in its own network namespace (two TUN
# devices cannot talk to each other inside one namespace, as the kernel routes locally);
# `setns` enters a namespace on a test thread. nix 0.29 declares rust-version 1.69.
nix = { version = "0.29", features = ["sched"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
